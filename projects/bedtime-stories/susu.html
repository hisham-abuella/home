<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<meta name="description" content="The true story of Susu, the cat Papa Hisham adopted in Oklahoma, told for Yusuf in English and Arabic.">
<meta property="og:title" content="Susu the Cat">
<meta property="og:description" content="A family story for a baby, narrated in English and Arabic.">
<meta property="og:type" content="website">
<title>Susu the Cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..700&family=Fredoka:wght@400..700&family=Noto+Kufi+Arabic:wght@400..900&display=swap">
<style>
  :root{
    --page:#FCFBF6;
    --ink:#111010;
    --red:#D7263D;
    --surround:#1C1B17;
    --surround-2:#262519;
    --quiet:#8E8A7D;
    --rule:rgba(17,16,16,.14);
    --accent:var(--red);
    --tint:transparent;
    --display:"Fraunces","Iowan Old Style",Georgia,serif;
    --story:"Fredoka","Avenir Next Rounded","Trebuchet MS",system-ui,sans-serif;
  }
  [lang="ar"]{
    --display:"Noto Kufi Arabic","Fraunces",Georgia,serif;
    --story:"Baloo Bhaijaan 2","Noto Kufi Arabic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(120% 80% at 50% 0%, var(--surround-2) 0%, var(--surround) 62%);
    color:var(--page);
    font-family:var(--story);
    padding:20px 16px 36px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  /* ---------- top bar ---------- */
  .bar{
    width:min(820px,100%);
    display:flex;
    gap:10px;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
  }
  .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(252,251,246,.08);border:1px solid rgba(252,251,246,.14)}
  .seg button{
    background:transparent;border:none;color:#C9C5B4;
    font-family:var(--display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    padding:7px 13px;border-radius:999px;transition:background .18s ease,color .18s ease;
  }
  .seg button[aria-pressed="true"]{background:var(--page);color:var(--ink);font-weight:700}
  .seg button:hover:not([aria-pressed="true"]){color:var(--page)}
  .seg.lang button{font-family:var(--story);letter-spacing:.04em;text-transform:none;font-size:.86rem}

  /* ---------- the book ---------- */
  .book{
    width:min(820px,100%);
    background:var(--page);
    color:var(--ink);
    border-radius:14px;
    box-shadow:0 26px 60px -24px rgba(0,0,0,.85);
    overflow:hidden;
  }
  .spread{
    padding:28px 26px 22px;
    display:flex;
    flex-direction:column;
    gap:16px;
    animation:settle .42s ease both;
  }
  @keyframes settle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    max-height:min(56vh,480px);
    margin-inline:auto;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:var(--tint);
    overflow:hidden;
  }
  .stage svg.art{width:100%;height:100%;max-width:100%;display:block}
  .stage img.art{width:100%;height:100%;max-width:100%;max-height:100%;min-width:0;min-height:0;display:block;object-fit:contain;border-radius:12px}
  .breathe{animation:breathe 5.2s ease-in-out infinite;transform-origin:50% 62%}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
  .bird{position:absolute;width:14%;animation:flit 7s ease-in-out infinite}
  @keyframes flit{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(4deg)}}

  /* ---------- words ---------- */
  .words{display:flex;flex-direction:column;gap:9px;text-align:center;max-width:32ch;margin-inline:auto}
  .animal{
    font-family:var(--display);
    font-weight:900;
    font-size:clamp(2.2rem,9.5vw,3.3rem);
    letter-spacing:.03em;
    text-transform:uppercase;
    line-height:1;
    text-wrap:balance;
    margin:0;
    color:var(--accent);
  }
  [lang="ar"] .animal{text-transform:none;letter-spacing:0;line-height:1.3}
  .animal.plain{color:var(--ink)}
  .line{font-size:clamp(1.1rem,4.2vw,1.45rem);font-weight:500;line-height:1.4;text-wrap:balance;margin:0}
  .sound{
    font-family:var(--display);font-style:italic;font-weight:600;
    font-size:clamp(1.25rem,5vw,1.7rem);color:var(--accent);margin:0;
  }
  [lang="ar"] .sound{font-style:normal;font-weight:700}

  /* ---------- cover ---------- */
  .cover h1{
    font-family:var(--display);font-weight:900;
    font-size:clamp(2.4rem,10vw,3.7rem);line-height:.95;margin:0;text-wrap:balance;
  }
  [lang="ar"] .cover h1{line-height:1.25}
  .cover h1 em{font-style:normal;color:var(--accent)}
  .eyebrow{
    font-family:var(--display);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--quiet);margin:0;
  }
  [lang="ar"] .eyebrow{letter-spacing:0;font-size:.85rem}
.dedication{
    font-family:var(--display);font-style:italic;font-weight:600;
    font-size:clamp(1.05rem,3.6vw,1.3rem);color:var(--accent);margin:0;
  }
  [lang="ar"] .dedication{font-style:normal}
  .cover-rule{height:6px;background:var(--ink);width:72px;margin:2px auto;border-radius:4px}
  .namer{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
    border-top:1px solid var(--rule);padding-top:14px;
  }
  .namer label{font-size:.95rem;color:#3b3a35}
  .namer input{
    font:inherit;font-size:1rem;padding:8px 12px;width:11ch;
    border:2px solid var(--ink);border-radius:9px;background:var(--page);color:var(--ink);text-align:center;
  }
  .namer input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* ---------- listen ---------- */
  .listen{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .play{
    display:inline-flex;align-items:center;gap:10px;
    border:2px solid var(--ink);background:var(--ink);color:var(--page);
    border-radius:999px;padding:11px 22px;font-family:var(--story);font-size:1.02rem;font-weight:600;
    transition:transform .14s ease;
  }
  .play:hover{transform:translateY(-2px)}
  .play[data-state="playing"]{background:var(--accent);border-color:var(--accent)}
  .play.ghost{background:transparent;color:var(--ink)}
  .play.ghost:active{background:var(--ink);color:var(--page)}
  .play .ico{width:15px;height:17px;flex:none}

  .note{
    border-top:1px solid var(--rule);padding-top:11px;
    display:flex;gap:10px;align-items:flex-start;
    font-family:var(--display);font-style:italic;font-size:.9rem;line-height:1.45;color:#4a4842;
  }
  [lang="ar"] .note{font-family:var(--story);font-style:normal;font-size:.92rem}
  .note b{
    font-style:normal;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:.62rem;color:var(--quiet);padding-top:.3em;white-space:nowrap;flex:none;
  }
  [lang="ar"] .note b{letter-spacing:0;font-size:.72rem}
  body.notes-off .note{display:none}

  /* ---------- controls ---------- */
  .controls{width:min(820px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}
  button{font:inherit;cursor:pointer}
  .turn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--page);color:var(--ink);border:none;border-radius:999px;
    padding:12px 20px;font-weight:600;font-size:1rem;
    box-shadow:0 8px 20px -10px rgba(0,0,0,.9);transition:transform .14s ease;
  }
  .turn:hover{transform:translateY(-2px)}
  .turn .arrow{font-size:1.05em;line-height:1}
  .turn[disabled]{opacity:.3;cursor:default;transform:none}
  :focus-visible{outline:3px solid var(--red);outline-offset:3px}
  .dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .dots span{width:9px;height:9px;border-radius:50%;background:rgba(252,251,246,.3);transition:background .2s,transform .2s}
  .dots span.on{background:var(--page);transform:scale(1.35)}

  .footer{width:min(820px,100%);display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .pill{
    background:transparent;border:1px solid rgba(252,251,246,.26);color:#C9C5B4;border-radius:999px;
    padding:7px 14px;font-family:var(--display);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  }
  [lang="ar"] .pill{font-family:var(--story);letter-spacing:0;font-size:.82rem;text-transform:none}
  .pill:hover{border-color:rgba(252,251,246,.6);color:var(--page)}
  .pill[aria-pressed="true"]{border-color:var(--page);color:var(--page)}

  /* ---------- full screen ---------- */
  body.big{padding:8px 0 0;gap:8px;justify-content:flex-start;min-height:100vh}
  body.big .bar{width:min(1000px,96%)}
  body.big .book{width:100%;max-width:none;border-radius:0;box-shadow:none;flex:1;display:flex;align-items:center}
  body.big .spread{width:min(1000px,100%);margin-inline:auto;padding:12px 24px 104px;gap:20px}
  body.big .stage{max-height:min(66vh,820px)}
  body.big .animal{font-size:clamp(3rem,7vw,5rem)}
  body.big .line{font-size:clamp(1.3rem,2.6vw,2rem)}
  body.big .sound{font-size:clamp(1.5rem,3vw,2.4rem)}
  body.big .cover h1{font-size:clamp(3rem,7.5vw,5.4rem)}
  body.big .words{max-width:40ch}
  body.big .note{display:none}
  body.big .footer{display:none}
  body.big .controls{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    width:min(1000px,96%);z-index:5;
  }

  @media (max-width:430px){
    .turn{padding:11px 15px;font-size:.94rem}
    .spread{padding:18px 15px 16px}
    .controls{gap:8px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
  img{max-width:100%}
  [hidden]{display:none!important}
  .home-link{text-decoration:none;display:inline-flex;align-items:center}
  body.big .home-link{display:none}
</style>
</head>
<body>
<div class="bar">
  <a class="pill home-link" href="../../index.html">&larr; hisham abuella</a>
  <a class="pill home-link" href="black-white-zoo.html" id="zooLink">the zoo book</a>
  <button class="pill" id="artBtn" type="button"></button>
  <button class="pill" id="fsBtn" type="button"></button>
  <div class="seg lang" id="langs" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="ar" aria-pressed="false" lang="ar">العربية</button>
  </div>
</div>

<div class="book"><section class="spread" id="spread"></section></div>

<div class="controls">
  <button class="turn" id="prev" type="button"><span class="arrow" id="prevArrow">&larr;</span><span data-t="back">Back</span></button>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button class="turn" id="next" type="button"><span data-t="next">Turn the page</span><span class="arrow" id="nextArrow">&rarr;</span></button>
</div>

<div class="footer">
  <button class="pill" id="autoBtn" type="button" aria-pressed="true"></button>
  <button class="pill" id="notesBtn" type="button"></button>
  <button class="pill" id="startBtn" type="button"></button>
</div>

<audio id="player" preload="none"></audio>
<audio id="sfx" preload="none"></audio>

<script>

   Art — every animal drawn as bold shapes on a 400x400 field
   ============================================================ */
var INK = '#111010', PAPER = '#FCFBF6', RED = '#D7263D';

  <ellipse cx="200" cy="286" rx="88" ry="94" fill="${FUR}" stroke="${INK}" stroke-width="8"/>

  <path d="M276 110 l-10 -72 l-62 46 z" fill="${FUR}" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
  <path d="M136 92 l6 -34 l30 24 z" fill="${NOSE}"/>
  <path d="M264 92 l-6 -34 l-30 24 z" fill="${NOSE}"/>
  <circle cx="200" cy="160" r="82" fill="${FUR}" stroke="${INK}" stroke-width="8"/>

  <g stroke="${INK}" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M156 190 l-52 -14 M156 202 l-54 8 M244 190 l52 -14 M244 202 l54 8"/>
  </g>`;

// curled up asleep
var SUSU_CURL = `
  <ellipse cx="200" cy="330" rx="170" ry="34" fill="${INK}" opacity=".12"/>
  <path d="M206 160 q150 0 154 106 q4 82 -112 82 q-64 0 -64 -38 q0 -32 54 -32 q48 0 48 -32 q0 -38 -80 -38 z"

ART.susuCover = `<svg class="art breathe" viewBox="0 0 400 400" role="img" aria-label="Susu, a tabby cat with white paws, sitting">

ART.california = `<svg class="art breathe" viewBox="0 0 400 400" role="img" aria-label="Susu curled on a sunny window sill">

  <circle cx="300" cy="86" r="46" fill="${WARM}" stroke="${INK}" stroke-width="8"/>
  <g stroke="${INK}" stroke-width="8"><path d="M200 20 v236 M40 138 h320"/></g>
  <path d="M26 256 h348 v26 h-348 z" fill="${WHITE}" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>

ART.mama = `<svg class="art breathe" viewBox="0 0 400 400" role="img" aria-label="Susu beside a teapot and two cups">
  <g stroke="${INK}" stroke-width="8" stroke-linejoin="round">
    <path d="M250 150 q60 0 60 50 q0 50 -60 50 q-60 0 -60 -50 q0 -50 60 -50 z" fill="${NOSE}"/>

function render(){
  var page = pages()[at];
  var copy = page[lang];
  var ui = UI[lang];

  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', ui.dir);
  document.body.setAttribute('lang', lang);
  document.body.setAttribute('dir', ui.dir);

  document.documentElement.style.setProperty('--accent', BOOK[ch].accent);
  spread.className = 'spread' + (page.cover ? ' cover' : '');
  spread.parentNode.style.setProperty('--tint', page.tint ? page.tint + '26' : 'transparent');

  var artwork = (useImages && page.img)
    ? '<img class="art photo breathe" id="pageArt" src="' + page.img + '" alt="">'
    : page.art;
  var html = '<div class="stage" style="--tint:' + (page.tint ? page.tint + '26' : 'transparent') + '">' + artwork + '</div>';

  if (page.cover) {
    html += '<div class="words">' +
      '<p class="eyebrow">' + copy.eyebrow + '</p>' +
      '<h1>' + copy.title + '</h1>' +
      '<div class="cover-rule"></div>' +
      '<p class="dedication">' + (lang === 'ar' ? 'إلى ' : 'For ') + '<span class="babyname">Yusuf</span></p>' +
      '<p class="line">' + copy.line + '</p>' +
    '</div>';
  } else {
    html += '<div class="words">' +
      '<h2 class="animal' + (ch === 'bw' ? ' plain' : '') + '"' +
        (ch === 'color' && page.tint ? ' style="color:' + page.tint + '"' : '') + '>' + copy.name + '</h2>' +
      '<p class="line">' + copy.line + '</p>' +
      '<p class="sound">' + copy.sound + '</p>' +
    '</div>';
  }

  html += '<div class="listen"><button class="play" id="playBtn" type="button">' +
    '<svg class="ico" viewBox="0 0 15 17" aria-hidden="true"><path d="M1 1 L14 8.5 L1 16 Z" fill="currentColor"/></svg>' +
    '<span id="playLabel">' + ui.listen + '</span></button>';
  if (page.snd) {
    html += '<button class="play ghost" id="sfxBtn" type="button">' +
      '<svg class="ico" viewBox="0 0 18 17" aria-hidden="true">' +
        '<path d="M1 6 h4 L10 1.5 v14 L5 11 H1 Z" fill="currentColor"/>' +
        '<path d="M13 5.5 q2.6 3 0 6 M15.6 3.4 q4.4 5.1 0 10.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
      '</svg><span>' + ui.sound + '</span></button>';
  }
  html += '</div>';

  if (page.cover) {
    html += '<div class="namer"><label for="babyname">' + ui.readTo + '</label>' +
      '<input id="babyname" type="text" autocomplete="off" maxlength="18" placeholder="' + ui.placeholder + '" value="' +
      babyName.replace(/"/g, '&quot;') + '"></div>';
  }

  html += '<p class="note"><b>' + ui.grownups + '</b><span>' + copy.note + '</span></p>';

  spread.innerHTML = html;

  // an illustration that has not been generated yet falls back to the drawing
  var photo = document.getElementById('pageArt');
  if (photo) {
    var toDrawing = function () {
      var stage = photo.parentNode;
      if (!stage) return;
      stage.innerHTML = page.art;
      if (page.perch) addBird(stage, page);
    };
    photo.addEventListener('error', toDrawing);
    // the error may already have fired before this handler was attached
    if (photo.complete && photo.naturalWidth === 0) toDrawing();
  }

  // the red bird, hiding in a different corner on every animal page
  if (page.perch) addBird(spread.querySelector('.stage'), page);

  applyName();

  var input = document.getElementById('babyname');
  if (input) {
    input.addEventListener('input', function () {
      babyName = input.value;
      applyName();
      try { localStorage.setItem('susu-name', babyName.trim()); } catch (e) {}
    });
  }
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  var sfxBtn = document.getElementById('sfxBtn');
  if (sfxBtn) sfxBtn.addEventListener('click', playSound);

  // chrome
  prevBtn.querySelector('[data-t]').textContent = ui.back;
  nextBtn.querySelector('[data-t]').textContent = at === 0 ? ui.start : ui.next;
  prevBtn.disabled = at === 0;
  nextBtn.disabled = at === pages().length - 1;
  notesBtn.textContent = document.body.classList.contains('notes-off') ? ui.notesOff : ui.notesOn;
  autoBtn.textContent = autoplay ? ui.autoOn : ui.autoOff;
  autoBtn.setAttribute('aria-pressed', String(autoplay));
  startBtn.textContent = ui.cover;
  fsBtn.textContent = big ? ui.small : ui.big;
  document.getElementById('zooLink').textContent = ui.zoo;
  artBtn.textContent = useImages ? ui.artPhoto : ui.artDrawn;
  artBtn.setAttribute('aria-pressed', String(useImages));
  document.getElementById('prevArrow').textContent = ui.arrowPrev;
  document.getElementById('nextArrow').textContent = ui.arrowNext;

  Array.prototype.forEach.call(dots.children, function (d, n) { d.classList.toggle('on', n === at); });

  loadAudio();
}

function addBird(stage, page) {
  var wrap = document.createElement('div');
  wrap.innerHTML = BIRD;
  var bird = wrap.firstChild;
  bird.style.left = page.perch[0] + '%';
  bird.style.top = page.perch[1] + '%';
  stage.appendChild(bird);
}

function applyName() {
  var fallback = lang === 'ar' ? 'يوسف' : 'Yusuf';
  Array.prototype.forEach.call(document.querySelectorAll('.babyname'), function (s) {
    s.textContent = babyName.trim() || fallback;
  });
}

function buildDots() {
  dots.innerHTML = '';
  pages().forEach(function () { dots.appendChild(document.createElement('span')); });
}

/* ---------- audio ---------- */
function loadAudio() {
  player.pause();
  player.src = AUDIO_DIR[ch][lang] + pages()[at].audio + '.mp3';
  setPlayState(false);
}

function setPlayState(playing) {
  var btn = document.getElementById('playBtn');
  if (!btn) return;
  btn.dataset.state = playing ? 'playing' : 'idle';
  document.getElementById('playLabel').textContent = playing ? t('pause') : t('listen');
}

function togglePlay() {
  unlocked = true;
  if (player.paused) {
    player.play().then(function () { setPlayState(true); }).catch(function () { setPlayState(false); });
  } else {
    player.pause();
    setPlayState(false);
  }
}

function playSound() {
  unlocked = true;
  var page = pages()[at];
  if (!page.snd) return;
  sfx.src = SFX_DIR[ch][lang] + page.snd + '.mp3';
  sfx.currentTime = 0;
  sfx.play().catch(function () {});
}

player.addEventListener('ended', function () { setPlayState(false); });
player.addEventListener('pause', function () { setPlayState(false); });

function show(i) {
  at = Math.max(0, Math.min(pages().length - 1, i));
  render();
  if (autoplay && unlocked) {
    player.play().then(function () { setPlayState(true); }).catch(function () {});
  }
  document.querySelector('.book').scrollIntoView({ block: 'nearest' });
}

/* ---------- chrome events ---------- */
nextBtn.addEventListener('click', function () { show(at + 1); });
prevBtn.addEventListener('click', function () { show(at - 1); });
startBtn.addEventListener('click', function () { show(0); });

notesBtn.addEventListener('click', function () {
  var off = document.body.classList.toggle('notes-off');
  notesBtn.textContent = off ? t('notesOff') : t('notesOn');
});

autoBtn.addEventListener('click', function () {
  autoplay = !autoplay;
  autoBtn.textContent = autoplay ? t('autoOn') : t('autoOff');
  autoBtn.setAttribute('aria-pressed', String(autoplay));
});

artBtn.addEventListener('click', function () {
  useImages = !useImages;
  try { localStorage.setItem('susu-art', useImages ? 'photo' : 'drawn'); } catch (e) {}
  render();
});

fsBtn.addEventListener('click', function () {
  big = !big;
  document.body.classList.toggle('big', big);
  if (big) {
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  } else if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(function () {});
  }
  render();
});

document.addEventListener('fullscreenchange', function () {
  if (!document.fullscreenElement && big) {
    big = false;
    document.body.classList.remove('big');
    render();
  }
});

document.getElementById('langs').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  lang = b.dataset.lang;
  Array.prototype.forEach.call(this.children, function (x) {
    x.setAttribute('aria-pressed', String(x === b));
  });
  render();
});

document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') show(lang === 'ar' ? at - 1 : at + 1);
  if (e.key === 'ArrowLeft') show(lang === 'ar' ? at + 1 : at - 1);
});

var x0 = null;
var book = document.querySelector('.book');
book.addEventListener('touchstart', function (e) { x0 = e.changedTouches[0].clientX; }, { passive: true });
book.addEventListener('touchend', function (e) {
  if (x0 === null) return;
  var dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 50) show(at + ((dx < 0) === (lang !== 'ar') ? 1 : -1));
  x0 = null;
}, { passive: true });

try {
  var saved = localStorage.getItem('susu-name');
  if (saved) babyName = saved;
  var savedArt = localStorage.getItem('susu-art');
  if (savedArt) useImages = savedArt === 'photo';
} catch (e) {}

buildDots();
render();
</script>
</body>
</html>
