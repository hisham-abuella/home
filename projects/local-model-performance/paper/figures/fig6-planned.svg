<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 176" font-family='"Times New Roman", Times, serif' font-size="11" role="img" aria-labelledby="t d">
<title id="t">Fig. 6. Plan experiment: three local models building STATS 101 from the same Opus plan</title>
<desc id="d">Horizontal bars give each local model's wall-clock minutes building STATS 101 from the shared plan written by Opus, against the 240-minute limit (dashed line). The label beside each bar gives the outcome and how many of the plan's 30 slides were written. Local runs cost $0 per token.</desc>
<defs>
  <pattern id="p-diag" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="5" height="5" fill="#fff"/><line x1="0" y1="0" x2="0" y2="5" stroke="#000" stroke-width="1.4"/></pattern>
  <pattern id="p-cross" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="5" height="5" fill="#fff"/><path d="M0 0V5M0 0H5" stroke="#000" stroke-width="0.9"/></pattern>
  <pattern id="p-horiz" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="#fff"/><line x1="0" y1="2" x2="4" y2="2" stroke="#000" stroke-width="1.2"/></pattern>
  <pattern id="p-dots" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="#fff"/><circle cx="2" cy="2" r="0.9" fill="#000"/></pattern>
  <pattern id="p-light" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#777" stroke-width="0.8"/></pattern>
</defs>
<rect width="340" height="176" fill="#fff"/>
<line x1="84" y1="136" x2="84" y2="139" stroke="#000" stroke-width="0.8"/><text x="84" y="149" text-anchor="middle" font-size="10">0</text><line x1="140.3" y1="10" x2="140.3" y2="136" stroke="#ccc" stroke-width="0.5"/><line x1="140.3" y1="136" x2="140.3" y2="139" stroke="#000" stroke-width="0.8"/><text x="140.3" y="149" text-anchor="middle" font-size="10">60</text><line x1="196.6" y1="10" x2="196.6" y2="136" stroke="#ccc" stroke-width="0.5"/><line x1="196.6" y1="136" x2="196.6" y2="139" stroke="#000" stroke-width="0.8"/><text x="196.6" y="149" text-anchor="middle" font-size="10">120</text><line x1="252.9" y1="10" x2="252.9" y2="136" stroke="#ccc" stroke-width="0.5"/><line x1="252.9" y1="136" x2="252.9" y2="139" stroke="#000" stroke-width="0.8"/><text x="252.9" y="149" text-anchor="middle" font-size="10">180</text><line x1="309.2" y1="10" x2="309.2" y2="136" stroke="#ccc" stroke-width="0.5"/><line x1="309.2" y1="136" x2="309.2" y2="139" stroke="#000" stroke-width="0.8"/><text x="309.2" y="149" text-anchor="middle" font-size="10">240</text><line x1="84" y1="10" x2="84" y2="136" stroke="#000" stroke-width="0.8"/><line x1="84" y1="136" x2="328" y2="136" stroke="#000" stroke-width="0.8"/><text x="206" y="166" text-anchor="middle" font-size="11">Wall-clock time (min)</text><line x1="309.2" y1="10" x2="309.2" y2="136" stroke="#000" stroke-width="0.9" stroke-dasharray="3 2"/><text x="305.2" y="19" text-anchor="end" font-size="9" font-style="italic">limit 240 min</text><rect x="84" y="20" width="18.9" height="22" fill="url(#p-cross)" stroke="#000" stroke-width="0.8"/><text x="79" y="34.5" text-anchor="end" font-size="10">qwen3.6 35B-A3B</text><text x="107.9" y="29" text-anchor="start" font-size="10" font-weight="bold">20.1 min: finished</text><text x="107.9" y="41" text-anchor="start" font-size="9.5" font-style="italic">30 of 30 slides, judge 9/10</text><rect x="84" y="62" width="68.1" height="22" fill="url(#p-horiz)" stroke="#000" stroke-width="0.8"/><text x="79" y="76.5" text-anchor="end" font-size="10">gemma4 26B</text><text x="157.1" y="71" text-anchor="start" font-size="10" font-weight="bold">72.6 min: stopped early</text><text x="157.1" y="83" text-anchor="start" font-size="9.5" font-style="italic">10 of 30 slides, no deck</text><rect x="84" y="104" width="57.3" height="22" fill="url(#p-diag)" stroke="#000" stroke-width="0.8"/><text x="79" y="118.5" text-anchor="end" font-size="10">qwen3.8 27B</text><text x="146.3" y="113" text-anchor="start" font-size="10" font-weight="bold">61.0 min: API error</text><text x="146.3" y="125" text-anchor="start" font-size="9.5" font-style="italic">10 of 30 slides, no deck</text>
