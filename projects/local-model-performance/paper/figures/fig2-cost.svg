ext><text x="120" y="256" text-anchor="middle" font-size="11" font-weight="bold">Wireless 101</text><rect x="209" y="25.4" width="34" height="148.6" fill="#000" stroke="#000" stroke-width="0.8"/><text x="226" y="22.4" text-anchor="middle" font-size="9.5">$2.79</text><text x="229.5" y="179" text-anchor="end" font-size="10" transform="rotate(-90 229.5 179)">Opus 5.5</text><rect x="247" y="136.6" width="34" height="37.4" fill="#8c8c8c" stroke="#000" stroke-width="0.8"/><text x="264" y="133.6" text-anchor="middle" font-size="9.5">$0.70</text><text x="267.5" y="179" text-anchor="end" font-size="10" transform="rotate(-90 267.5 179)">Sonnet 5.5</text><rect x="285" y="157.1" width="34" height="16.9" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="302" y="154.1" text-anchor="middle" font-size="9.5">$0.32</text><text x="305.5" y="179" text-anchor="end" font-size="10" transform="rotate(-90 305.5 179)">Haiku 5.5</text><text x="264" y="256" text-anchor="middle" font-size="11" font-weight="bold">STATS 101</text>
</svg>
