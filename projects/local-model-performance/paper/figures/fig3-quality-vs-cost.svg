<title id="t">Fig. 3. Judge score against cost, finished decks of Wireless 101 and STATS 101</title>
<desc id="d">Each point is one finished deck of the two main tasks: judge overall score (out of 10) against API list-price cost. Marker shape gives the model, fill gives the task (black Wireless 101, white STATS 101).</desc>
